<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1150" role="img" aria-labelledby="title desc">
  <title id="title">Образцы цвета для интерьера</title>
  <desc id="desc">Крупные выкрасные поля в шалфейном, оливковом и тёплом терракотовом оттенках на светлой штукатурной стене.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee9df"/>
      <stop offset=".55" stop-color="#d9d4c9"/>
      <stop offset="1" stop-color="#c9c7ba"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf5" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#fffdf5" stop-opacity="0"/>
      <stop offset="1" stop-color="#293a2f" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b48d67"/>
      <stop offset="1" stop-color="#80644d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope=".23"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="1150" fill="url(#wall)"/>
  <rect width="900" height="790" fill="url(#light)"/>
  <path d="M0 0h215L0 560z" fill="#fffdf5" opacity=".2"/>
  <path d="M76 170c12-12 27-16 43-13l184 18c19 2 31 17 29 37l-37 382c-2 20-17 32-36 30l-183-18c-18-2-30-16-28-34z" fill="#8e9c82" filter="url(#shadow)"/>
  <path d="M335 142c15-11 30-13 49-7l183 60c18 6 26 23 20 42L465 596c-7 19-25 27-43 21l-177-58c-19-6-27-23-21-42z" fill="#415b47" filter="url(#shadow)"/>
  <path d="M602 220c14-12 31-13 48-4l147 79c17 9 22 27 13 44L633 680c-10 18-28 23-45 14l-141-76c-17-9-22-27-13-44z" fill="#b47a5d" filter="url(#shadow)"/>
  <path d="M0 764h900v386H0z" fill="url(#table)"/>
  <path d="M0 794c185-22 407-21 900 0" fill="none" stroke="#d5b48d" stroke-opacity=".48" stroke-width="4"/>
  <path d="M0 940c256-18 523-16 900 2M0 1087c272-13 565-10 900 4" fill="none" stroke="#674f3d" stroke-opacity=".18" stroke-width="3"/>
  <g filter="url(#shadow)" transform="translate(506 755) rotate(-8 150 160)">
    <rect x="18" y="16" width="278" height="338" rx="3" fill="#f3eee3"/>
    <rect x="42" y="42" width="230" height="94" fill="#d5d2c7"/>
    <rect x="42" y="136" width="230" height="94" fill="#899780"/>
    <rect x="42" y="230" width="230" height="94" fill="#415b47"/>
    <path d="M42 136h230M42 230h230" stroke="#f3eee3" stroke-width="4"/>
  </g>
  <rect width="900" height="1150" fill="#183a2b" opacity=".06"/>
</svg>
